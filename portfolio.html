<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio | Jessie Parkinson</title>
<meta name="robots" content="noindex, nofollow">

  This page's content is encrypted in the LOCKED object at the bottom and only opens with the passcode.

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --black: #000000;
    --white: #FFFFFF;
    --grey: #3A3A3A;
    --grey-light: #C8C8C8;
    --bg: #FFFFFF;
    --ink: #000000;
    --card: #FFFFFF;
    --card-ink: #000000;
    --muted: #444444;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --ink: #FFFFFF;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --ink: #FFFFFF;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  h1, h2, button, .links a { font-family: "Space Grotesk", Inter, system-ui, sans-serif; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .sample a:focus-visible, .lock :focus-visible { outline-color: var(--black); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
  [hidden] { display: none !important; }

  /* Hero */
  .hero {
    position: relative; isolation: isolate; overflow: hidden;
    background: var(--black); color: var(--white);
    text-align: center; padding: 64px 0 72px;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0; z-index: -2;
    background: linear-gradient(115deg,
      var(--black) 0%, var(--grey) 30%, var(--white) 50%, var(--grey) 70%, var(--black) 100%);
    background-size: 300% 100%; background-position: 0% 50%;
    opacity: 0.25;
    animation: drift 14s ease-in-out infinite;
  }
  .hero::after {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: radial-gradient(ellipse 60% 75% at 50% 50%, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
  }
  @keyframes drift {
    0%   { background-position: 0% 50%;   opacity: 0.25; }
    50%  { background-position: 100% 50%; opacity: 0.5; }
    100% { background-position: 0% 50%;   opacity: 0.25; }
  }
  .hero h1 {
    font-weight: 700; font-size: clamp(40px, 7vw, 76px); line-height: 1;
    letter-spacing: -0.02em; margin: 0 0 28px;
  }
  .avatar {
    display: block; width: 160px; height: 160px; margin: 0 auto 24px;
    border-radius: 50%; border: 3px solid var(--white); object-fit: cover;
    background: var(--black);
  }
  .hero p { font-size: clamp(17px, 2vw, 20px); margin: 0 auto; max-width: 30em; color: var(--grey-light); }

  /* Passcode box */
  .lock {
    max-width: 460px; margin: 48px auto 0; padding: 30px;
    background: var(--card); color: var(--card-ink);
    border: 2px solid var(--black); border-radius: 20px;
  }
  .lock h2 { font-weight: 700; font-size: 28px; line-height: 1.1; margin: 0 0 10px; }
  .lock p { margin: 0 0 18px; color: var(--muted); }
  .lock label { display: block; font-weight: 600; font-size: 15px; margin-bottom: 8px; }
  .lock input {
    display: block; width: 100%; font: inherit; color: var(--black); background: var(--white);
    padding: 12px 14px; border: 2px solid var(--black); border-radius: 10px; margin-bottom: 14px;
  }
  .lock button {
    width: 100%; cursor: pointer;
    background: var(--black); color: var(--white); font-weight: 700; font-size: 15px;
    padding: 12px 18px; border: 2px solid var(--black); border-radius: 10px;
  }
  .lock button:hover:not(:disabled) { background: var(--white); color: var(--black); }
  .lock button:disabled { cursor: progress; opacity: 0.6; }
  .lock .status { margin: 14px 0 0; min-height: 1.55em; font-weight: 600; color: var(--black); }

  /* Unlocked content */
  .intro { max-width: 680px; padding-top: 56px; }
  .intro p { margin: 0 0 14px; }
  .intro .lead {
    font-family: "Space Grotesk", Inter, system-ui, sans-serif; font-weight: 500;
    font-size: clamp(21px, 2.6vw, 26px); line-height: 1.3; letter-spacing: -0.01em;
  }
  .samples {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px;
    margin: 34px 0 0; padding: 0; list-style: none;
  }
  .sample {
    display: flex; flex-direction: column; gap: 14px; padding: 28px 30px 30px;
    background: var(--card); color: var(--card-ink);
    border: 2px solid var(--black); border-radius: 20px;
  }
  .sample h2 { font-weight: 700; font-size: 26px; line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
  .sample p { margin: 0; color: var(--muted); }
  .sample .result { color: var(--black); font-weight: 600; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; margin: 0; }
  .sample .links { margin-top: auto; padding-top: 10px; }
  .links a {
    background: var(--black); color: var(--white); font-weight: 700; font-size: 15px; text-decoration: none;
    padding: 12px 18px; border: 2px solid var(--black); border-radius: 10px; overflow-wrap: anywhere;
  }
  .links a:hover { background: var(--white); color: var(--black); }
  .contact { padding: 64px 0 24px; }
  .contact h2 { font-weight: 700; font-size: 28px; margin: 0 0 16px; }
  /* On the page background, so these follow the page colours in dark mode */
  .contact .links a { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .contact .links a:hover { background: var(--bg); color: var(--ink); }

  /* Footer */
  footer {
    background: var(--black); color: var(--white); padding: 40px 0 56px; margin-top: 48px;
    border-top: 2px solid var(--white);
  }
  footer nav { display: flex; flex-wrap: wrap; gap: 12px; }
  footer nav a {
    color: var(--white); text-decoration: none; font-weight: 600; font-size: 15px;
    border: 2px solid var(--white); padding: 10px 16px;
  }
  footer nav a:hover { background: var(--white); color: var(--black); }
  footer nav a:focus-visible { outline-color: var(--white); }
  footer p { margin: 28px 0 0; color: var(--grey-light); font-size: 14px; }

  @media (max-width: 680px) {
    .samples { grid-template-columns: 1fr; gap: 24px; }
    .sample { padding: 22px 22px 24px; }
    .lock { padding: 24px 22px; margin-top: 36px; }
    .hero { padding: 56px 0 64px; }
    .intro { padding-top: 44px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero::before { animation: none; background-position: 50% 50%; opacity: 0.35; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1>Portfolio</h1>
    <img class="avatar" src="assets/jessie.jpg" alt="Jessie Parkinson" width="160" height="160">
    <p>Writing and content samples from Jessie Parkinson.</p>
  </div>
</header>

<main class="wrap">
  <form class="lock" id="lock">
    <h2>This page is private</h2>
    <p>Type the passcode you were sent to see the samples.</p>
    <label for="passcode">Passcode</label>
    <input id="passcode" name="passcode" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <button type="submit" id="unlock">Open the portfolio</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <noscript><p class="status">This page needs JavaScript switched on to open.</p></noscript>
  </form>
  <div id="content" hidden></div>
</main>

<footer>
  <div class="wrap">
    <nav>
      <a href="/">Everything else I've built</a>
    </nav>
    <p>© 2026 Jessie Parkinson</p>
  </div>
</footer>

  const form = document.getElementById("lock");
  const input = document.getElementById("passcode");
  const button = document.getElementById("unlock");
  const status = document.getElementById("status");
  const content = document.getElementById("content");
  const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

  async function decrypt(passcode) {
    const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(passcode.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: bytes(LOCKED.salt), iterations: LOCKED.iterations, hash: "SHA-256" },
      material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(LOCKED.iv) }, key, bytes(LOCKED.data));
    return new TextDecoder().decode(plain);
  }

  async function open(passcode) {
    if (!passcode.trim()) return;
    if (!window.crypto || !crypto.subtle) {
      status.textContent = "This browser can't open the page. Try a recent version of Chrome, Safari, Edge or Firefox.";
      return;
    }
    button.disabled = true;
    status.textContent = "Opening…";
    try {
      content.innerHTML = await decrypt(passcode);
      content.querySelectorAll('a[href^="http"]').forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
      form.hidden = true;
      content.hidden = false;
    } catch (e) {
      status.textContent = "That passcode didn't work. Check it and try again.";
      button.disabled = false;
      input.focus();
      input.select();
    }
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); open(input.value); });

  // A link ending in #passcode opens the page straight away.
  function fromLink() {
    let code = location.hash.slice(1);
    try { code = decodeURIComponent(code); } catch (e) {}
    if (code) { input.value = code; open(code); }
  }
  window.addEventListener("hashchange", fromLink);
  fromLink();
</script>
